<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QackerCore - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes rotate-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes grid-scroll {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 40px 40px;
      }
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -20px) scale(1.1);
      }

      100% {
        transform: translate(-20px, 30px) scale(1);
      }
    }

    @keyframes softEntrance {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-rotate-slow {
      animation: rotate-slow 8s linear infinite;
    }

    .animate-grid-scroll {
      animation: grid-scroll 3s linear infinite;
    }

    .animate-drift {
      animation: drift 15s ease-in-out infinite alternate;
    }

    .delay-2000 {
      animation-delay: 2s;
    }

    /* High Contrast Corporate Light Theme Overrides */
    body.bg-\[\#020617\] {
      background-color: #F8FAFC !important;
      color: #111827 !important;
    }

    /* LEFT section (brand): Clean and light */
    .bg-\[\#0f172a\] {
      background-color: #FFFFFF !important;
      border-color: rgba(0, 0, 0, 0.08) !important;
    }

    /* RIGHT section (form container): Gradient #353A5F -> #9EBAF3 */
    .bg-slate-900\/40 {
      background: linear-gradient(135deg, #353A5F, #9EBAF3) !important;
      box-shadow: 0 20px 40px -10px rgba(53, 58, 95, 0.3), 0 4px 6px -2px rgba(53, 58, 95, 0.15) !important;
      border: none !important;
    }

    /* Clean up text in right section so it's readable on gradient */
    #form-container h2,
    #form-container h3,
    #form-container p,
    #form-container label,
    #form-container button.text-slate-500 {
      color: #FFFFFF !important;
    }

    #form-container .text-white {
      color: #FFFFFF !important;
    }

    #form-container .h-1 {
      background-color: rgba(255, 255, 255, 0.4) !important;
    }

    #form-container i {
      color: #FFFFFF !important;
      opacity: 0.9 !important;
    }

    /* Back button fix */
    #form-container [onclick="setMode('select')"] {
      color: rgba(255, 255, 255, 0.8) !important;
    }

    /* Role cards inside right panel with glassmorphism */
    .bg-white\/\[0\.03\] {
      background-color: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08) !important;
    }

    .bg-white\/\[0\.03\]:hover {
      background-color: rgba(255, 255, 255, 0.85) !important;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.12) !important;
    }

    .bg-white\/\[0\.03\] .text-white {
      color: #111827 !important;
    }

    .bg-white\/\[0\.03\] .text-slate-500 {
      color: #4B5563 !important;
    }

    .bg-white\/\[0\.03\] i {
      color: #353A5F !important;
    }

    /* Icon wrapper inside role cards */
    .bg-white\/\[0\.03\] .bg-indigo-500\/10,
    .bg-white\/\[0\.03\] .bg-emerald-500\/10 {
      background-color: rgba(53, 58, 95, 0.1) !important;
    }

    /* Form inputs inside right panel */
    .bg-black\/40 {
      background-color: rgba(255, 255, 255, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.5) !important;
      color: #111827 !important;
    }

    input::placeholder {
      color: #6B7280 !important;
      font-weight: 500;
    }

    input {
      font-weight: 500 !important;
    }

    /* Primary buttons */
    #admin-submit,
    #user-submit {
      background: linear-gradient(135deg, #353A5F, #9EBAF3) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15) !important;
      color: #FFFFFF !important;
    }

    /* Universal Button Animations */
    button {
      transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease !important;
    }

    button:hover {
      filter: brightness(1.05) !important;
      transform: translateY(-2px) !important;
    }

    /* Brand Left text colors */
    .bg-\[\#0f172a\] .text-white {
      color: #111827 !important;
    }

    .bg-\[\#0f172a\] .text-slate-400 {
      color: #4B5563 !important;
    }

    .bg-\[\#0f172a\] .text-slate-500 {
      color: #6B7280 !important;
    }

    body>div.w-full.max-w-5xl {
      animation: softEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (min-width: 1025px) {
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #9CA3AF;
        border-radius: 3px;
      }
    }

    @media (max-width: 1024px) {
      ::-webkit-scrollbar {
        display: none;
      }
    }
  </style>
</head>

<body
  class="min-h-screen w-full bg-[#020617] flex items-center justify-center p-6 relative max-md:overflow-hidden md:overflow-y-auto overflow-x-hidden font-sans text-slate-200">

  <!-- Background Layer -->
  <div class="absolute inset-0 z-0">
    <div
      class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-indigo-600/20 blur-[120px] rounded-full animate-drift">
    </div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-600/10 blur-[120px] rounded-full animate-drift delay-2000">
    </div>
    <div class="absolute inset-0 opacity-[0.03] animate-grid-scroll"
      style="background-image: radial-gradient(circle, white 1px, transparent 1px); background-size: 40px 40px;"></div>
  </div>

  <div
    class="w-full max-w-5xl grid md:grid-cols-2 gap-0 overflow-hidden rounded-[2.5rem] border border-white/10 shadow-[0_0_80px_rgba(0,0,0,0.6)] z-10 bg-slate-900/40 backdrop-blur-3xl">

    <!-- BRAND PANEL (LEFT) -->
    <div
      class="bg-[#0f172a] p-12 flex-col justify-between relative overflow-hidden border-r border-white/5 hidden md:flex">
      <div class="absolute inset-0 opacity-5">
        <div class="w-full h-full animate-grid-scroll"
          style="background-image: linear-gradient(to right, white 1px, transparent 1px), linear-gradient(to bottom, white 1px, transparent 1px); background-size: 40px 40px;">
        </div>
      </div>
      <div class="relative z-10">
        <div class="relative w-20 h-20 mb-12 group">
          <div class="absolute inset-0 bg-indigo-600/20 rounded-2xl animate-rotate-slow"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <i data-lucide="radio" class="text-indigo-600"></i>
          </div>
        </div>
        <h1 class="text-6xl font-black text-white tracking-tighter leading-[0.85] mb-6">
          QACKER<br />
          <span
            class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 font-black">NEXUS</span>
        </h1>
        <p class="text-slate-400 text-lg font-medium max-w-xs border-l-2 border-indigo-500/50 pl-4 py-1">Advanced
          tracking protocol for the Quora data ecosystem.</p>
      </div>
      <div
        class="relative z-10 pt-8 border-t border-white/5 flex items-center justify-between text-[10px] text-slate-500 font-mono tracking-widest uppercase">
        <div class="flex items-center gap-3">
          <i data-lucide="fingerprint" class="w-4 h-4 text-indigo-500 animate-pulse"></i>
          <span>AUTH_V5.0_STABLE</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1 bg-white/5 rounded-full">
          <div class="w-1 h-1 bg-emerald-500 rounded-full animate-ping"></div> SECURE_LINK
        </div>
      </div>
    </div>

    <!-- FORM PANEL (RIGHT) -->
    <div class="p-8 md:p-16 flex flex-col justify-center relative bg-slate-900/60 backdrop-blur-md min-h-[500px]"
      id="form-container">

      <!-- Error Message -->
      <div id="error-alert"
        class="hidden mb-8 p-4 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold rounded-2xl items-center gap-3">
        <div class="w-2 h-2 bg-rose-500 rounded-full animate-ping"></div>
        <span id="error-text"></span>
      </div>

      <!-- Mode Selector -->
      <div id="mode-select" class="space-y-6">
        <div class="mb-10">
          <h2 class="text-3xl font-black text-white mb-2 uppercase tracking-tight">Access Gate</h2>
          <div class="h-1 w-12 bg-indigo-500 rounded-full mb-4"></div>
          <p class="text-slate-500 text-sm font-medium">Clearance required to proceed.</p>
        </div>
        <button onclick="setMode('admin')"
          class="group w-full flex items-center justify-between p-6 bg-white/[0.03] border border-white/10 rounded-3xl hover:bg-indigo-600/10 transition">
          <div class="flex items-center gap-5">
            <div class="p-4 bg-indigo-500/10 rounded-2xl"><i data-lucide="shield-check" class="text-indigo-400"></i>
            </div>
            <div class="text-left">
              <div class="text-white font-black uppercase">Admin</div>
              <div class="text-slate-500 text-[10px] font-black uppercase mt-0.5">Control & Management</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="text-slate-700"></i>
        </button>
        <button onclick="setMode('user')"
          class="group w-full flex items-center justify-between p-6 bg-white/[0.03] border border-white/10 rounded-3xl hover:bg-emerald-600/10 transition">
          <div class="flex items-center gap-5">
            <div class="p-4 bg-emerald-500/10 rounded-2xl"><i data-lucide="user" class="text-emerald-400"></i></div>
            <div class="text-left">
              <div class="text-white font-black uppercase">Contributor</div>
              <div class="text-slate-500 text-[10px] font-black uppercase mt-0.5">Activity & Collaboration</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="text-slate-700"></i>
        </button>
      </div>

      <!-- Admin Form -->
      <form id="admin-form" class="hidden space-y-6">
        <div class="mb-8 flex items-center justify-between">
          <div>
            <h3 class="text-xl font-black text-white uppercase tracking-tighter">Admin Credentials</h3>
            <div class="h-1 w-8 bg-indigo-500 rounded-full mt-1"></div>
          </div>
          <button type="button" onclick="setMode('select')"
            class="flex items-center gap-2 text-[10px] text-slate-500 uppercase"><i data-lucide="arrow-left"
              class="w-3 h-3"></i> Back</button>
        </div>
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-500 uppercase">Identity Path</label>
            <div class="relative">
              <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
              <input type="email" id="admin-email" required placeholder="admin@nexus.io"
                class="w-full pl-12 pr-4 py-4 bg-black/40 border border-white/5 rounded-2xl outline-none focus:border-indigo-500 text-sm">
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-500 uppercase">Encryption Key</label>
            <div class="relative">
              <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
              <input type="password" id="admin-password" required placeholder="••••••••"
                class="w-full pl-12 pr-4 py-4 bg-black/40 border border-white/5 rounded-2xl outline-none focus:border-indigo-500 text-sm">
            </div>
          </div>
        </div>
        <button type="submit" id="admin-submit"
          class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black uppercase text-xs">Validate
          & Enter</button>
      </form>

      <!-- User Form -->
      <form id="user-form" class="hidden space-y-8 text-center">
        <div class="mb-2 flex items-center justify-between text-left">
          <div>
            <h3 class="text-xl font-black text-white uppercase tracking-tighter">Operative Entry</h3>
            <div class="h-1 w-8 bg-emerald-500 rounded-full mt-1"></div>
          </div>
          <button type="button" onclick="setMode('select')"
            class="flex items-center gap-2 text-[10px] text-slate-500 uppercase"><i data-lucide="arrow-left"
              class="w-3 h-3"></i> Back</button>
        </div>
        <div class="space-y-6">
          <div
            class="w-20 h-20 bg-emerald-500/10 rounded-[2rem] flex items-center justify-center text-emerald-500 mx-auto relative">
            <i data-lucide="key" class="w-8 h-8"></i>
          </div>
          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-500 uppercase">Alpha-Numeric Pass Key</label>
            <input type="password" id="user-passkey" required placeholder="REQUIRED_ID"
              class="w-full px-4 py-5 bg-black/40 border border-white/5 rounded-2xl outline-none focus:border-emerald-500 text-center tracking-[0.5em] font-mono text-lg">
          </div>
        </div>
        <button type="submit" id="user-submit"
          class="w-full py-5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-black uppercase text-xs">Decrypt
          Access</button>
      </form>

    </div>
  </div>

  <script src="js/firebase-config.js" type="module"></script>
  <script src="js/login.js" type="module"></script>
  <script>
    lucide.createIcons();
    function setMode(mode) {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('admin-form').classList.add('hidden');
      document.getElementById('user-form').classList.add('hidden');
      document.getElementById('error-alert').classList.add('hidden');
      if (mode === 'select') document.getElementById('mode-select').classList.remove('hidden');
      else if (mode === 'admin') document.getElementById('admin-form').classList.remove('hidden');
      else if (mode === 'user') document.getElementById('user-form').classList.remove('hidden');
    }
  </script>
</body>

</html>
